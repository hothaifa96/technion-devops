# postgres: only the backend and the data-generator job may connect.
# postgres itself never initiates connections -> no egress rules (only DNS from 01).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: backend
        - podSelector:
            matchLabels:
              app: data-generator
      ports:
        - { protocol: TCP, port: 5432 }
---
# The generator job only needs to reach postgres.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: data-generator
  namespace: shop
spec:
  podSelector:
    matchLabels:
      app: data-generator
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: postgres
      ports:
        - { protocol: TCP, port: 5432 }
