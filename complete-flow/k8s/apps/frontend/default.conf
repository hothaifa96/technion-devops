server {
    listen 8080;

    location / {
        root /usr/share/nginx/html;
        index index.html;
    }

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /healthz {
        access_log off;
        return 200 "ok\n";
    }
}

server {
    listen 8081;

    location /stub_status {
        stub_status;
        access_log off;
    }
}
