apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - 01-postgres.yaml
  - 02-backend.yaml
  - 03-frontend.yaml
  - 04-data-generator-cronjob.yaml

configMapGenerator:
  - name: frontend-html
    namespace: shop
    files:
      - frontend/index.html
  - name: frontend-nginx-conf
    namespace: shop
    files:
      - frontend/default.conf
