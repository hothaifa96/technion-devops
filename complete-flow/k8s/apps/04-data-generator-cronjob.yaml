apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-generator
  namespace: shop
automountServiceAccountToken: false
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-generator
  namespace: shop
spec:
  schedule: "0 * * * *"            # minute 0 of every hour
  concurrencyPolicy: Forbid         # never run two generators at the same time
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 120
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app: data-generator
            tier: batch
        spec:
          serviceAccountName: data-generator
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: generator
              image: complete-flow/backend:1.0
              imagePullPolicy: IfNotPresent
              command: ["python", "generate.py"]
              envFrom:
                - configMapRef:
                    name: backend-config
              env:
                - name: ROWS
                  value: "25"
                - name: DB_NAME
                  valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_DB } }
                - name: DB_USER
                  valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_USER } }
                - name: DB_PASSWORD
                  valueFrom: { secretKeyRef: { name: postgres-credentials, key: POSTGRES_PASSWORD } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 300m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
