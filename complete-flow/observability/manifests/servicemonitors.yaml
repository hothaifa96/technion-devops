# Tell the Prometheus Operator WHAT to scrape. The operator turns these into
# scrape_configs inside Prometheus - no prometheus.yml editing.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: backend
  namespace: shop
spec:
  selector:
    matchLabels:
      app: backend
  endpoints:
    - port: http
      path: /metrics
      interval: 15s
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: frontend
  namespace: shop
spec:
  selector:
    matchLabels:
      app: frontend
  endpoints:
    - port: metrics
      interval: 15s
