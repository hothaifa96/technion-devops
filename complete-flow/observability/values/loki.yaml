# helm upgrade --install loki grafana/loki --version 7.5.0 -n monitoring -f values/loki.yaml
# Single-binary Loki with filesystem storage - perfect for a lab, NOT for production.
deploymentMode: SingleBinary

loki:
  auth_enabled: false            # single tenant, no X-Scope-OrgID header needed
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  limits_config:
    retention_period: 48h
  pattern_ingester:
    enabled: true

# we don't need alert-rule evaluation inside Loki (Prometheus/Alertmanager does ours)
ruler: { enabled: false }

singleBinary:
  replicas: 1
  persistence:
    size: 2Gi
  resources:
    requests: { cpu: 100m, memory: 256Mi }

# turn off every component of the "simple scalable" / distributed modes
backend: { replicas: 0 }
read: { replicas: 0 }
write: { replicas: 0 }
ingester: { replicas: 0 }
querier: { replicas: 0 }
queryFrontend: { replicas: 0 }
queryScheduler: { replicas: 0 }
distributor: { replicas: 0 }
compactor: { replicas: 0 }
indexGateway: { replicas: 0 }
bloomCompactor: { replicas: 0 }
bloomGateway: { replicas: 0 }

gateway: { enabled: false }
chunksCache: { enabled: false }
resultsCache: { enabled: false }
lokiCanary: { enabled: false }
test: { enabled: false }
minio: { enabled: false }
