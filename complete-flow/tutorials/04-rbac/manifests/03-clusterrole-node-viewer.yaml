# STEP: nodes live at CLUSTER scope -> only ClusterRole + ClusterRoleBinding can grant them
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: node-viewer
rules:
  - apiGroups: [""]
    resources: ["nodes"]                        # cluster-scoped resource
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alice-node-viewer
subjects:
  - kind: ServiceAccount
    name: alice
    namespace: rbac-lab
roleRef:
  kind: ClusterRole
  name: node-viewer
  apiGroup: rbac.authorization.k8s.io
