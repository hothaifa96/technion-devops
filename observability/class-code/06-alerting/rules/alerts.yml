groups:
  - name: shop-alerts
    rules:
      - alert: ShopDown
        expr: up{job="shop"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "shop instance {{ $labels.instance }} is down"
          description: "Prometheus cannot scrape {{ $labels.instance }} for 30s."

      - alert: ShopHighErrorRate
        expr: job:shop_http_errors:ratio1m > 0.03
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx ratio on {{ $labels.job }}"
          description: "Error ratio is {{ $value | humanizePercentage }} (threshold 3%)."
          runbook_url: "https://example.com/runbooks/shop-high-error-rate"

      - alert: ShopSlowCheckout
        expr: endpoint:shop_http_latency_seconds:p95{endpoint="/checkout"} > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "p95 latency of /checkout is {{ $value | humanizeDuration }}"

      - alert: ShopNoTraffic
        expr: absent(shop_http_requests_total) or job:shop_http_requests:rate1m == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "shop receives no traffic"
