modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []        # defaults to 2xx
      preferred_ip_protocol: ip4
      follow_redirects: true

  http_body_match:
    prober: http
    http:
      fail_if_body_not_matches_regexp: ["nginx"]

  tcp_connect:
    prober: tcp
    timeout: 3s

  dns_google:
    prober: dns
    dns:
      query_name: google.com
      query_type: A
