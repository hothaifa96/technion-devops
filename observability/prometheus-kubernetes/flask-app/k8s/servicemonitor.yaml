apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flask-prometheus
  namespace: monitoring
  labels:
    # Must match the Prometheus Operator's serviceMonitorSelector.
    release: monitoring
spec:
  namespaceSelector:
    matchNames:
      - default
  selector:
    matchLabels:
      app: flask-prometheus
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
