apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "[pre-{{ if .Release.IsInstall }}install{{ else }}upgrade{{ end }}] running DB migrations for revision {{ .Release.Revision }}"
              sleep 5
              {{- if .Values.failMigration }}
              echo "migration FAILED"; exit 1
              {{- end }}
              echo "migration done"
