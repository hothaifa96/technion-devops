- name: Configure all training machines
  hosts: all
  become: true
  tasks:
    - name: Require Debian family targets
      ansible.builtin.assert:
        that:
          - ansible_facts['os_family'] == 'Debian'

    - name: Install baseline packages
      ansible.builtin.apt:
        name: '{{ baseline_packages }}'
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create application directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: directory
        owner: root
        group: root
        mode: '0755'
      loop:
        - /srv/demo
        - /srv/demo/releases

    - name: Install managed login banner
      ansible.builtin.copy:
        dest: /etc/motd
        content: "Managed by Ansible: {{ inventory_hostname }} training machine.\n"
        owner: root
        group: root
        mode: '0644'
