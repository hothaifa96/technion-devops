[defaults]
inventory = /work/inventory/hosts.yml
roles_path = /work/roles
host_key_checking = True
retry_files_enabled = False
interpreter_python = /usr/bin/python3
forks = 5

[ssh_connection]
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/root/.ssh/known_hosts -o HostKeyAlgorithms=ssh-ed25519
