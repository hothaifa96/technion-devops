<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>// devops.quiz-show</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../shared/theme.css" />
</head>
<body>
  <div class="crt-overlay"></div>

  <header class="topbar">
    <div class="brand"><span class="brand-prompt">$</span><span class="brand-text">devops --quiz-show</span><span class="cursor-blink">_</span></div>
    <div class="topbar-actions">
      <a class="home-link" href="../index.html">&lt; games</a>
      <button id="btnFullscreen" class="btn btn-ghost">fullscreen</button>
    </div>
  </header>

  <!-- setup -->
  <section id="setup" class="panel">
    <h2>&gt; configure round</h2>
    <p class="muted">Pick topics, number of questions and mode. Keys <b>1-4</b> answer, <b>Enter</b> = next.</p>
    <div id="topicBoxes" style="display:flex;gap:1rem;flex-wrap:wrap;margin:1rem 0"></div>
    <div style="display:flex;gap:1.5rem;flex-wrap:wrap;align-items:center;margin-bottom:1.2rem">
      <label>questions <select id="numQ" class="topic-select"><option>10</option><option selected>15</option><option>20</option><option value="999">all</option></select></label>
      <label>seconds / question <select id="secs" class="topic-select"><option>15</option><option selected>20</option><option>30</option><option value="0">no timer</option></select></label>
      <label>mode <select id="mode" class="topic-select"><option value="solo">solo</option><option value="teams">2 teams (alternate)</option></select></label>
    </div>
    <button id="btnStart" class="btn btn-primary">start &gt;&gt;</button>
  </section>

  <!-- game -->
  <section id="game" class="panel hidden">
    <div class="statusbar">
      <span class="pill" id="progress">Q 1/10</span>
      <span class="pill" id="topicPill">topic</span>
      <span class="pill" id="turnPill">turn: <strong>TEAM A</strong></span>
      <span class="pill">A: <strong id="scoreA">0</strong> &nbsp; B: <strong id="scoreB">0</strong></span>
    </div>
    <div id="timer" class="timer"><div></div></div>
    <div id="question" class="question-text"></div>
    <div id="choices" class="choices"></div>
    <div id="explain" class="explain hidden"></div>
    <div style="margin-top:1.2rem;text-align:right">
      <button id="btnNext" class="btn btn-primary hidden">next &gt;&gt;</button>
    </div>
  </section>

  <!-- results -->
  <section id="results" class="panel hidden">
    <h2>&gt; results</h2>
    <div id="resultText" class="question-text"></div>
    <div id="review"></div>
    <button id="btnAgain" class="btn btn-primary">play again</button>
  </section>

  <script src="questions.js"></script>
  <script src="app.js"></script>
</body>
</html>
