apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: backend
spec:
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
      - name: nginx
        image: nginx:latest
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: backend
spec:
  selector:
    app: nginx
  ports:
  - port: 80
    targetPort: 80

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-backend
  namespace: backend
spec:
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
    spec:
      containers:
      - name: busybox
        image: ubuntu:latest
        command:
        - /bin/sh
        - -c
        - |
           apt-get update && \
           apt-get install -y curl nano dnsutils && \
           while true; do sleep 3600; done
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: busybox-frontend
  namespace: frontend
spec:
  selector:
    matchLabels:
      app: busybox
  template:
    metadata:
      labels:
        app: busybox
        nginx: allow
    spec:
      containers:
      - name: busybox
        image: ubuntu:latest
        command:
        - /bin/sh
        - -c
        - |
          apt-get update && \
          apt-get install -y curl nano dnsutils && \
          while true; do sleep 3600; done
