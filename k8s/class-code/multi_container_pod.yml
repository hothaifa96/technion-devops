apiVersion: v1
kind: Pod
metadata:
  name: demo-pod-1
spec:
  containers:
    - name: nginx-container
      image: nginx:latest
      ports:
        - containerPort: 80
      env:
        - name: ADMIN_PASSWORD
          value: t123456
    - name: sidecar
      image: grafana/grafana
      ports:
        - containerPort: 3000
          