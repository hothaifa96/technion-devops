apiVersion: v1
kind: Pod
metadata:
  name: devops
spec:
  containers: 
    - name: nginx
      image: nginx:latest
      ports: 
        - containerPort: 80
      resources:
        limits:
          cpu: 0.1m
          memory: 500Mi
        requests:
          cpu: 0.05m
          memory: 127Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx2
spec:
  containers:
  - name: nginx2
    image: nginx
    resources:
      limits:
        memory: "128Mi"
        cpu: "500m"
    ports:
      - containerPort: 80
