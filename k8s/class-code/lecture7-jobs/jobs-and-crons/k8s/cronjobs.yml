# Same images as jobs.yml, but on a schedule
apiVersion: batch/v1
kind: CronJob
metadata:
  name: python-cron
spec:
  schedule: "*/1 * * * *"          # every minute
  timeZone: "Asia/Jerusalem"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: python
              image: jobs-python:1.0
              imagePullPolicy: Never
              env:
                - name: USER_ID
                  value: "3"
---
