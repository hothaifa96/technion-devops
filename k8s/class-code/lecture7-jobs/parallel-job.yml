# 10 work items, 3 at a time. Each pod gets JOB_COMPLETION_INDEX (Indexed mode).
apiVersion: batch/v1
kind: Job
metadata:
  name: image-resizer
spec:
  completions: 10
  parallelism: 3
  completionMode: Indexed
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: worker
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "processing image-${JOB_COMPLETION_INDEX}.png on $(hostname)"
              sleep $((RANDOM % 5 + 3))
              echo "done ${JOB_COMPLETION_INDEX}"
