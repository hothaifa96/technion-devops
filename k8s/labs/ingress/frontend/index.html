<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>XO Game</title>
<style>
  body { font-family: sans-serif; text-align: center; margin: 2rem; }
  .board { display: grid; grid-template-columns: repeat(3, 80px); gap: 4px; margin: 1rem auto; width: fit-content; }
  .cell { width: 80px; height: 80px; font-size: 2rem; border: 1px solid #333; cursor: pointer; background: #f9f9f9; }
  .cell:disabled { cursor: not-allowed; }
  .score { margin: 1rem; }
</style>
</head>
<body>
  <h1>XO Game</h1>
  <div id="status"></div>
  <div class="board" id="board"></div>
  <div class="score" id="score"></div>
  <button id="reset">Reset Game</button>

<script>
let cfg = {};

async function loadConfig() {
  const res = await fetch('/config.json');
  cfg = await res.json();
  loadGame();
  loadScore();
}

async function loadGame() {
  const res = await fetch(cfg.gameUrl);
  const data = await res.json();
  drawBoard(data);
  if (data.winner) recordWin(data.winner);
  else if (data.board.every(c => c)) recordDraw();
}

function drawBoard(data) {
  const b = document.getElementById('board');
  b.innerHTML = '';
  document.getElementById('status').textContent = data.winner
    ? 'Winner: ' + data.winner
    : 'Current: ' + data.current;
  data.board.forEach((cell, i) => {
    const btn = document.createElement('button');
    btn.className = 'cell';
    btn.textContent = cell || '';
    btn.disabled = !!data.winner || !!cell;
    btn.onclick = () => move(i, data.current);
    b.appendChild(btn);
  });
}

async function move(pos, player) {
  await fetch(cfg.gameUrl + '/move', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ position: pos, player: player })
  });
  loadGame();
}

async function recordWin(player) {
  await fetch(cfg.scoreUrl + '/win', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ player })
  });
  loadScore();
}

async function recordDraw() {
  await fetch(cfg.scoreUrl + '/draw', { method: 'POST' });
  loadScore();
}

async function loadScore() {
  const res = await fetch(cfg.scoreUrl);
  const data = await res.json();
  document.getElementById('score').textContent =
    `X: ${data.xWins} | O: ${data.oWins} | Draws: ${data.draws}`;
}

async function resetAll() {
  await fetch(cfg.gameUrl + '/reset');
  await fetch(cfg.scoreUrl + '/reset');
  loadGame();
  loadScore();
}

document.getElementById('reset').onclick = resetAll;
loadConfig();
</script>
</body>
</html>
