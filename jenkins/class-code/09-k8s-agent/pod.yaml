apiVersion: v1
kind: Pod
metadata:
  labels:
    jenkins: agent
spec:
  serviceAccountName: jenkins-agent   # needs RBAC to deploy (see k8s/labs/security/lab1-rbac.md)
  containers:
    - name: python
      image: python:3.12-slim
      command: ["sleep"]
      args: ["infinity"]
      resources:
        requests: { cpu: 100m, memory: 128Mi }
    - name: kaniko
      image: gcr.io/kaniko-project/executor:debug
      command: ["sleep"]
      args: ["infinity"]
      volumeMounts:
        - name: docker-config
          mountPath: /kaniko/.docker
    - name: helm
      image: alpine/helm:3.15.4
      command: ["sleep"]
      args: ["infinity"]
  volumes:
    - name: docker-config
      secret:
        secretName: dockerhub-config
        items:
          - key: .dockerconfigjson
            path: config.json
